<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Add LoRA Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../style.css?v=2" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <section class="model-form-panel">
            <div class="model-form-header">
                <div>
                    <h2>Add LoRA Form</h2>
                    <p>Register a new LoRA entry in the local LoRA registry.</p>
                </div>
                <a class="secondary nav-link" href="model_page.html">Back to LoRAs</a>
            </div>
            <form id="lora-form" class="model-form">
                <label class="field">
                    <span>LoRA ID</span>
                    <input name="lora_id" type="text" placeholder="Auto-assigned" readonly />
                </label>
                <label class="field">
                    <span>Name</span>
                    <input name="name" type="text" placeholder="My style adapter" />
                </label>
                <label class="field">
                    <span>Family</span>
                    <select name="lora_model_family" required>
                        <option value="" disabled selected>Select a family</option>
                        <option value="sd15">sd15</option>
                        <option value="sdxl">sdxl</option>
                        <option value="flux">flux</option>
                        <option value="qwen-image">qwen-image</option>
                        <option value="z-image">z-image</option>
                        <option value="ernie-image">ernie-image</option>
                    </select>
                </label>
                <label class="field">
                    <span>LoRA Type</span>
                    <select name="lora_type" required>
                        <option value="" disabled selected>Select a LoRA type</option>
                        <option value="lora">lora</option>
                        <option value="lycoris">lycoris</option>
                        <option value="lokr">lokr</option>
                    </select>
                </label>
                <label class="field">
                    <span>Adapter Use</span>
                    <select id="adapter-use" name="adapter_use">
                        <option value="standard" selected>Standard</option>
                        <option value="qwen_image_lightning">Qwen Image Lightning</option>
                    </select>
                </label>
                <div id="lightning-profile-panel" class="model-link-panel" hidden>
                    <p>Qwen Image Lightning profile</p>
                    <label class="field">
                        <span>Base Variant</span>
                        <input id="lightning-base-variant" type="text" value="qwen-image-2512" readonly />
                    </label>
                    <label class="field">
                        <span>Steps</span>
                        <select id="lightning-steps">
                            <option value="4">4</option>
                            <option value="8">8</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>True CFG</span>
                        <input id="lightning-true-cfg" type="text" value="1.0" readonly />
                    </label>
                    <label class="field">
                        <span>Scheduler Profile</span>
                        <input id="lightning-scheduler-profile" type="text" value="qwen_image_lightning_shift3" readonly />
                    </label>
                    <label class="field">
                        <span>Adapter Strength</span>
                        <input id="lightning-adapter-strength" type="text" value="1.0" readonly />
                    </label>
                    <label class="field">
                        <span>Supported Task</span>
                        <input id="lightning-supported-task" type="text" value="text2img" readonly />
                    </label>
                </div>
                <label class="field">
                    <span>Location Type</span>
                    <select name="lora_location" required>
                        <option value="local">Local</option>
                        <option value="hub">Hub</option>
                    </select>
                </label>
                <div id="local-file-panel" class="model-link-panel">
                    <button id="select-local-file" class="secondary" type="button">Select local file</button>
                </div>
                <label id="web-file-panel" class="field model-link-panel" hidden>
                    <span>Website/Hugging Face Link</span>
                    <input id="web-file-input" type="text" placeholder="owner/repo or https://huggingface.co/owner/repo" />
                </label>
                <div id="hub-coordinates-panel" class="model-link-panel" hidden>
                    <label class="field">
                        <span>Hub Weight Name</span>
                        <input id="weight-name-field" type="text" placeholder="adapter.safetensors" />
                    </label>
                    <label class="field">
                        <span>Hub Subfolder</span>
                        <input id="subfolder-field" type="text" placeholder="Optional subfolder" />
                    </label>
                    <label class="field">
                        <span>Hub Revision</span>
                        <input id="revision-field" type="text" placeholder="Optional revision" />
                    </label>
                </div>
                <label class="field">
                    <span>File Path</span>
                    <input name="file_path" type="text" placeholder="Select a local file or enter a web link" readonly required />
                </label>
                <button class="primary" type="submit">Add LoRA</button>
            </form>
            <div id="lora-form-state" class="model-form-state" aria-live="polite"></div>
        </section>
    </div>

    <script src="../../api_config.js?v=1"></script>
    <script src="../../components/header.js?v=1"></script>
    <script src="../../components/nav_bar.js?v=3"></script>
    <script src="add.js?v=1"></script>
</body>

</html>
