<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Edit Base Model Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../style.css?v=2" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <section class="model-form-panel">
            <div class="model-form-header">
                <div>
                    <h2>Edit Base Model Form</h2>
                    <p>Update an existing base model entry in the model registry.</p>
                </div>
                <a class="secondary nav-link" href="registry.html">Back to models</a>
            </div>
            <form id="model-edit-form" class="model-form">
                <label class="field">
                    <span>Name</span>
                    <input name="name" type="text" readonly />
                </label>
                <label class="field">
                    <span>Family</span>
                    <select name="family" required>
                        <option value="" disabled>Select a family</option>
                        <option value="sd15">sd15</option>
                        <option value="sdxl">sdxl</option>
                        <option value="flux">flux</option>
                        <option value="qwen-image">qwen-image</option>
                        <option value="z-image">z-image</option>
                        <option value="ernie-image">ernie-image</option>
                    </select>
                </label>
                <label class="field">
                    <span>Model Type</span>
                    <select name="model_type" required>
                        <option value="diffusers">diffusers</option>
                        <option value="single-file">single-file</option>
                    </select>
                </label>
                <label class="field">
                    <span>Location Type</span>
                    <select name="location_type" required>
                        <option value="local">Local</option>
                        <option value="hub">Hub</option>
                    </select>
                </label>
                <label class="field">
                    <span>Model ID</span>
                    <input name="model_id" type="number" step="1" required />
                </label>
                <label class="field">
                    <span>Version</span>
                    <input name="version" type="text" placeholder="hub" required />
                </label>
                <div id="local-link-panel" class="model-link-panel">
                    <button id="select-local-link" class="secondary" type="button">Select local folder</button>
                </div>
                <label id="web-link-panel" class="field model-link-panel" hidden>
                    <span>Website/Hugging Face Link</span>
                    <input id="web-link-input" type="text" placeholder="runwayml/stable-diffusion-v1-5" />
                </label>
                <label class="field">
                    <span>Selected Path or Link</span>
                    <input name="link" type="text" placeholder="Select a local path or enter a web link" readonly required />
                </label>
                <button class="primary" type="submit">Save model</button>
            </form>
            <div id="model-edit-state" class="model-form-state" aria-live="polite"></div>
        </section>
    </div>

    <script src="../../api_config.js?v=1"></script>
    <script src="../../components/header.js?v=1"></script>
    <script src="../../components/nav_bar.js?v=3"></script>
    <script src="edit.js?v=1"></script>
</body>

</html>
