<div class="preset-panel">
    <button class="preset-toggle" type="button" id="preset-toggle">
        <span class="preset-toggle-label">Prompt + Generation Presets</span>
        <span class="preset-toggle-meta">
            <span class="preset-active-indicator is-hidden" id="preset-active-indicator">Preset Active</span>
        </span>
    </button>
    <div class="preset-content" id="preset-content">
        <label class="field">
            <span>Preset</span>
            <select id="preset-select">
                <option value="" selected>No presets</option>
            </select>
        </label>
        <div class="field-row field-row-3">
            <button class="secondary" id="preset-load" type="button">Load Preset</button>
            <button class="secondary" id="preset-add-new" type="button">Add New Preset</button>
            <button class="secondary" id="preset-refresh" type="button">Refresh</button>
        </div>
        <label class="field is-hidden" id="preset-name-field">
            <span>Preset Name</span>
            <input id="preset-name" type="text" placeholder="Preset name" />
        </label>
        <div class="field-row is-hidden" id="preset-create-actions">
            <button class="secondary" id="preset-save-new" type="button">Save New</button>
            <button class="secondary" id="preset-cancel" type="button">Cancel</button>
        </div>
        <div class="field-row is-hidden" id="preset-manage-actions">
            <button class="secondary" id="preset-update" type="button">Update</button>
            <button class="secondary" id="preset-delete" type="button">Delete</button>
        </div>
        <div class="field-hint" id="preset-status">No preset selected.</div>
    </div>
</div>
