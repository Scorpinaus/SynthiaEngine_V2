<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>SD 1.5 AnimateDiff Text-to-Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=5" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <div class="layout">
            <section class="controls">
                <label class="field">
                    <span>Model</span>
                    <select id="model_select">
                        <option value="" disabled selected>Loading models...</option>
                    </select>
                </label>

                <label class="field">
                    <span>Motion Adapter</span>
                    <input id="motion_adapter" type="text" value="guoyww/animatediff-motion-adapter-v1-5-2" />
                </label>

                <label class="field">
                    <span>Prompt</span>
                    <textarea id="prompt" placeholder="Enter video prompt..."></textarea>
                </label>

                <label class="field">
                    <span>Negative Prompt</span>
                    <textarea id="negative_prompt" class="textarea-small" placeholder="Optional negative prompt..."></textarea>
                </label>

                <div id="lora-panel-root"></div>

                <div id="preset-panel-root"></div>

                <div class="field-row">
                    <label class="field">
                        <span>Seed</span>
                        <input id="seed" type="number" value="0" step="1" />
                    </label>
                    <label class="field">
                        <span>Steps</span>
                        <input id="steps" type="number" value="25" step="1" min="1" />
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>CFG</span>
                        <input id="cfg" type="number" step="0.5" value="7.5" />
                    </label>
                    <label class="field">
                        <span>Videos</span>
                        <input id="num_videos" type="number" value="1" min="1" max="8" />
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Width</span>
                        <input id="width" type="number" value="512" step="8" min="64" />
                    </label>
                    <label class="field">
                        <span>Height</span>
                        <input id="height" type="number" value="512" step="8" min="64" />
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Frames</span>
                        <input id="num_frames" type="number" value="16" step="1" min="1" />
                    </label>
                    <label class="field">
                        <span>FPS</span>
                        <input id="fps" type="number" value="8" step="1" min="1" />
                    </label>
                </div>

                <div id="scheduler-panel-root"></div>

                <label class="field">
                    <span>Clip Skip</span>
                    <input id="clip_skip" type="number" value="1" min="0" max="8" />
                </label>

                <label class="field">
                    <span>Prompt Weighting</span>
                    <select id="weighting_policy">
                        <option value="diffusers-like" selected>Diffusers-like</option>
                        <option value="a1111-like">A1111-like</option>
                        <option value="comfyui-like">ComfyUI-like</option>
                    </select>
                </label>

                <button class="primary" id="generate-button" type="button">Generate Video</button>
            </section>

            <section class="gallery-panel">
                <div class="gallery-header">
                    <h2>Gallery</h2>
                    <p>Videos appear here when the job finishes.</p>
                </div>
                <div class="viewer">
                    <div class="viewer-frame">
                        <div id="viewer-empty" class="viewer-empty">No videos yet</div>
                        <video id="viewer-video" class="viewer-video" controls muted loop playsinline></video>
                    </div>
                    <div class="viewer-controls">
                        <button id="viewer-prev" class="secondary" type="button">Prev</button>
                        <span id="viewer-count">0 / 0</span>
                        <button id="viewer-next" class="secondary" type="button">Next</button>
                    </div>
                    <div id="viewer-thumbs" class="viewer-thumbs"></div>
                </div>
                <div id="jobs-queue-root"></div>
            </section>
        </div>
    </div>

    <script src="api_config.js?v=1"></script>
    <script src="header.js?v=1"></script>
    <script src="nav_bar.js?v=3"></script>
    <script src="video_gallery.js?v=1"></script>
    <script src="lora_panel.js?v=1"></script>
    <script src="scheduler_panel.js?v=1"></script>
    <script src="jobs_queue.js?v=2"></script>
    <script src="workflow_client.js?v=1"></script>
    <script src="workflow_catalog.js?v=1"></script>
    <script src="workflow_input_validator.js?v=1"></script>
    <script src="preset_panel.js?v=1"></script>
    <script src="sd15_animatediff.js?v=1"></script>
</body>

</html>
