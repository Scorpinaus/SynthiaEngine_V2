<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>WAN I2V 14B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css?v=5" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <div class="layout">
            <section class="controls">
                <div class="field warning-panel">
                    <strong>Slow / experimental</strong>
                    <span>WAN I2V 14B 480P can take a long time and may use heavy CPU offload.</span>
                </div>

                <label class="field">
                    <span>Input Image</span>
                    <input id="image" type="file" accept="image/*" />
                </label>

                <label class="field">
                    <span>Model</span>
                    <input id="model" type="text" value="D:\diffusion\diffusers\Wan2.1-I2V-14B-480P-Diffusers" />
                </label>

                <label class="field">
                    <span>Prompt</span>
                    <textarea id="prompt" placeholder="Enter video prompt..."></textarea>
                </label>

                <label class="field">
                    <span>Negative Prompt</span>
                    <textarea id="negative_prompt" class="textarea-small" placeholder="Optional negative prompt..."></textarea>
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>Seed</span>
                        <input id="seed" type="number" value="0" step="1" />
                    </label>
                    <label class="field">
                        <span>Steps</span>
                        <input id="steps" type="number" value="50" step="1" min="1" max="200" />
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Guidance</span>
                        <input id="guidance_scale" type="number" step="0.1" value="5.0" min="0" max="30" />
                    </label>
                    <label class="field">
                        <span>Frames</span>
                        <select id="num_frames">
                            <option value="33">33</option>
                            <option value="49">49</option>
                            <option value="81" selected>81</option>
                        </select>
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>Resolution</span>
                        <input id="resolution" type="text" value="832 x 480" readonly />
                    </label>
                    <input id="width" type="hidden" value="832" />
                    <input id="height" type="hidden" value="480" />
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>FPS</span>
                        <input id="fps" type="number" value="16" min="1" max="60" step="1" />
                    </label>
                    <label class="field">
                        <span>Memory</span>
                        <select id="memory_preset">
                            <option value="offload" selected>CPU Offload</option>
                            <option value="group_offload">Group Offload</option>
                        </select>
                    </label>
                </div>

                <label class="field">
                    <span>Quantization</span>
                    <select id="quantization">
                        <option value="none" selected>None</option>
                        <option value="bnb_8bit">8-bit Transformer/Text Encoder</option>
                    </select>
                </label>

                <label class="field checkbox-field">
                    <input id="experimental_ack" type="checkbox" checked />
                    <span>I understand this path is slow and experimental.</span>
                </label>

                <button class="primary" id="generate-button" type="button">Generate Video</button>
            </section>

            <section class="gallery-panel">
                <div class="gallery-header">
                    <h2>Gallery</h2>
                    <p>Videos appear here when the job finishes.</p>
                </div>
                <div class="viewer">
                    <div class="viewer-frame">
                        <div id="viewer-empty" class="viewer-empty">No videos yet</div>
                        <video id="viewer-video" class="viewer-video" controls muted loop playsinline></video>
                    </div>
                    <div class="viewer-controls">
                        <button id="viewer-prev" class="secondary" type="button">Prev</button>
                        <span id="viewer-count">0 / 0</span>
                        <button id="viewer-next" class="secondary" type="button">Next</button>
                    </div>
                    <div id="viewer-thumbs" class="viewer-thumbs"></div>
                </div>
                <div id="jobs-queue-root"></div>
            </section>
        </div>
    </div>

    <script src="../api_config.js?v=1"></script>
    <script src="../components/header.js?v=1"></script>
    <script src="../components/nav_bar.js?v=3"></script>
    <script src="../components/video_gallery.js?v=1"></script>
    <script src="../components/jobs_queue.js?v=2"></script>
    <script src="../workflow_client.js?v=1"></script>
    <script src="../workflow_catalog.js?v=1"></script>
    <script src="../workflow_input_validator.js?v=1"></script>
    <script src="image2video.js?v=1"></script>
</body>

</html>
