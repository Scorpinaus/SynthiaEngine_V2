<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Synthia Engine LoRA Models</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <section class="models-panel">
            <div class="models-header">
                <div>
                    <h2>LoRA Registry</h2>
                    <p>Review LoRA entries and manage registry metadata.</p>
                </div>
                <div class="models-actions">
                    <a class="secondary nav-link" href="lora_add.html">Add LoRA</a>
                    <button id="lora-refresh" class="secondary" type="button">Refresh</button>
                </div>
            </div>

            <div class="models-toolbar">
                <div class="models-summary">
                    <span id="lora-count">0</span>
                    <span class="models-summary-label">loras</span>
                    <span id="lora-updated" class="models-updated"></span>
                </div>
                <div class="models-filters">
                    <label class="models-filter">
                        <span>Search</span>
                        <input id="lora-search" type="search" placeholder="Search by name, family, ID, path, or type" />
                    </label>
                    <label class="models-filter">
                        <span>Family</span>
                        <select id="lora-family">
                            <option value="">All families</option>
                        </select>
                    </label>
                    <label class="models-filter">
                        <span>Sort</span>
                        <select id="lora-sort">
                            <option value="name">Name</option>
                            <option value="family">Family</option>
                            <option value="type">LoRA type</option>
                            <option value="location">Location</option>
                            <option value="id">LoRA ID</option>
                        </select>
                    </label>
                </div>
            </div>
            <div id="lora-state" class="models-state">Loading LoRA registry...</div>
            <div id="lora-grid" class="models-grid"></div>
        </section>
    </div>

    <script src="api_config.js?v=1"></script>
    <script src="header.js?v=1"></script>
    <script src="nav_bar.js?v=3"></script>
    <script src="lora_models.js?v=1"></script>
</body>

</html>
