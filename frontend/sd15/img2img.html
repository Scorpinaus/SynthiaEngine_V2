<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>SD 1.5 Image-to-Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../style.css?v=4" />
</head>

<body>
    <div class="app">
        <div id="header-root"></div>

        <div class="layout">
            <section class="controls">
                <label class="field">
                    <span>Model</span>
                    <select id="model_select">
                        <option value="" disabled selected>Loading models...</option>
                    </select>
                </label>

                <label class="field">
                    <span>Prompt</span>
                    <textarea id="prompt" placeholder="Enter prompt..."></textarea>
                </label>

                <label class="field">
                    <span>Negative Prompt</span>
                    <textarea id="negative_prompt" class="textarea-small" placeholder="Optional negative prompt..."></textarea>
                </label>

                <div id="controlnet-panel-root"></div>
                <div id="lora-panel-root"></div>

                <div id="ip_adapter_panel" class="ip-adapter-panel">
                    <button id="ip_adapter_toggle" class="ip-adapter-toggle" type="button" aria-expanded="false" aria-controls="ip_adapter_content">
                        <span>IP-Adapter</span>
                        <span id="ip_adapter_chevron" aria-hidden="true">&#9662;</span>
                    </button>
                    <div id="ip_adapter_content" class="ip-adapter-content">
                        <label class="field">
                            <span>Image Prompt Reference</span>
                            <span class="hires-toggle">
                                <span>Use image prompt reference</span>
                                <input id="ip_adapter_enabled" type="checkbox" />
                            </span>
                        </label>

                        <label class="field">
                            <span>IP-Adapter Image</span>
                            <input id="ip_adapter_image" type="file" accept="image/*" />
                        </label>

                        <div id="ip_adapter_preview_panel" class="ip-adapter-preview-panel">
                            <div id="ip_adapter_preview_empty" class="field-hint">No reference image selected.</div>
                            <img id="ip_adapter_preview" class="ip-adapter-preview is-hidden" alt="IP-Adapter reference preview" />
                        </div>

                        <label class="field">
                            <span>IP-Adapter Mask</span>
                            <input id="ip_adapter_mask_image" type="file" accept="image/*" />
                        </label>

                        <div id="ip_adapter_mask_preview_panel" class="ip-adapter-preview-panel">
                            <div id="ip_adapter_mask_preview_empty" class="field-hint">No IP-Adapter mask selected.</div>
                            <img id="ip_adapter_mask_preview" class="ip-adapter-preview is-hidden" alt="IP-Adapter mask preview" />
                        </div>

                        <div class="field-row">
                            <button id="ip_adapter_mask_editor_open" class="secondary" type="button">Create mask</button>
                            <button id="ip_adapter_mask_clear" class="secondary" type="button">Clear mask</button>
                        </div>
                        <div class="field-hint">White applies the image prompt. Black suppresses it.</div>

                        <label class="field">
                            <span>IP-Adapter Scale</span>
                            <input id="ip_adapter_scale" type="number" value="0.6" step="0.05" min="0" max="1" />
                        </label>
                    </div>
                </div>

                <div id="preset-panel-root"></div>

                <label class="field">
                    <span>Initial Image</span>
                    <input id="initial_image" type="file" accept="image/*" />
                </label>

                <label class="field">
                    <span>Strength</span>
                    <input id="strength" type="number" value="0.7" step="0.05" min="0" max="1" />
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>Seed</span>
                        <input id="seed" type="number" value="0" step="1" />
                    </label>
                    <label class="field">
                        <span>Steps</span>
                        <input id="steps" type="number" value="20" step="1" />
                    </label>
                </div>

                <div class="field-row">
                    <label class="field">
                        <span>CFG</span>
                        <input id="cfg" type="number" step="0.5" value="7.5" />
                    </label>

                    <label class="field">
                        <span>Images</span>
                        <input id="num_images" type="number" value="1" min="1" max="8" />
                    </label>
                </div>

                <div id="scheduler-panel-root"></div>

                <label class="field">
                    <span>LCM Mode</span>
                    <span class="hires-toggle">
                        <span>Use hard-coded SD1.5 LCM LoRA</span>
                        <input id="lcm_enabled" type="checkbox" />
                    </span>
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>Width</span>
                        <input id="width" type="number" value="512" step="8" min="64" />
                    </label>
                    <label class="field">
                        <span>Height</span>
                        <input id="height" type="number" value="512" step="8" min="64" />
                    </label>
                </div>
                
                <label class="field">
                    <span>Clip Skip</span>
                    <input id="clip_skip" type="number" value="1" min="0" max="8" />
                </label>

                <button class="primary" onclick="generateImg2Img()">Generate</button>
                <div class="controlnet-active-flag is-hidden" id="controlnet-active-flag">
                    ControlNet Active
                </div>
            </section>

            <section class="gallery-panel">
                <div class="gallery-header">
                    <h2>Gallery</h2>
                    <p>Outputs appear here as they render.</p>
                </div>
                <div class="viewer">
                    <div class="viewer-frame">
                        <div id="viewer-empty" class="viewer-empty">No images yet</div>
                        <img id="viewer-image" alt="Generated output" />
                    </div>
                    <div class="viewer-controls">
                        <button id="viewer-prev" class="secondary" type="button">Prev</button>
                        <span id="viewer-count">0 / 0</span>
                        <button id="viewer-next" class="secondary" type="button">Next</button>
                    </div>
                    <div id="viewer-thumbs" class="viewer-thumbs"></div>
                </div>
                <div id="jobs-queue-root"></div>
            </section>
        </div>
    </div>

    <div id="controlnet-preprocessor-root"></div>

    <script src="../api_config.js?v=1"></script>
    <script src="../components/header.js?v=1"></script>
    <script src="../components/nav_bar.js?v=3"></script>
    <script src="../components/gallery.js?v=1"></script>
    <script src="../components/scheduler_panel.js?v=1"></script>
    <script src="../components/lora_panel.js?v=1"></script>
    <script src="../components/jobs_queue.js?v=2"></script>
    <script src="../workflow_client.js?v=1"></script>
    <script src="../workflow_catalog.js?v=1"></script>
    <script src="../workflow_input_validator.js?v=1"></script>
    <script src="../components/controlnet_panel.js?v=2"></script>
    <script src="../components/controlnet_preprocessor.js?v=3"></script>
    <script src="../components/preset_panel.js?v=1"></script>
    <script src="../components/ip_adapter_panel.js?v=1"></script>
    <script src="img2img.js?v=5"></script>
</body>

</html>
